# =============================================================================
# SciNet++ -- P2-01 robotics data collection config (Pusher-v5)
# -----------------------------------------------------------------------------
# Drives scripts/collect_pusher.py. Only collects trajectories; no training.
#
#   python scripts/collect_pusher.py --config configs/robotics/pusher_data.yaml
#
# `seed` is reserved for MODEL initialisation in later phases (P2-02+). P2-01
# does not train, so it is unused here but kept for forward compatibility.
# `dataset_seed` is the data identity: changing it mints a new dataset_version.
# =============================================================================
experiment: pusher_data
seed: 42

dataset_seed: 20261110

env:
  id: Pusher-v5
  obs_dim: 23
  action_dim: 7
  action_low: -2.0
  action_high: 2.0
  max_episode_steps: 100

collection:
  # First-round budget: 100 episodes per policy (300 total). Mixture is the only
  # policy whose rollouts produce non-trivial object<->arm contact; the other two
  # are near-zero, which is an honest signal (see run report).
  policies:
    random: 100
    guided: 100
    mixture: 100
  # Deterministic episode allocation across splits (sums to 1.0).
  splits:
    train: 0.80
    validation: 0.10
    frozen_test: 0.05
    ood_test: 0.05
  # Record genuine MuJoCo contact: object body in contact with an ARM body
  # (world / object / goal excluded). NOT "any contact" -- the object always
  # rests on the table, so "any contact" is a constant 1.0 and useless as a
  # label. See robotics/envs/pusher_env.detect_contact for the exact rule.
  record_contact: true

output_dir: datasets/pusher_v1
